[project]
name = "olt-optimizer"
version = "0.1.0"
description = "Track optimizer for Open Layout Tool exports (radius/cant within an offset corridor)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# The terrain endpoint: plane transforms per Land, and GeoTIFF tiles (LZW needs
# imagecodecs). The rest of the service runs without them.
terrain = ["pyproj>=3.4", "tifffile>=2023.1", "imagecodecs>=2023.1"]

[project.scripts]
olt-optimize = "olt_optimizer.cli:main"
olt-optimizer-serve = "olt_optimizer.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olt_optimizer*"]

# The rule catalogues are data a run reads at request time — they must ship
# with the package, not just live in the source tree. `olt_optimizer/constraints`
# is a symlink to the repo's src/constraints/; setuptools copies what it points
# at, so the installed package carries the very files the app bundles.
[tool.setuptools.package-data]
olt_optimizer = ["constraints/*.json"]
